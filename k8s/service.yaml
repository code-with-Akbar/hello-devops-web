apiVersion: v1
kind: Service
metadata:
  name: hello-web-service
spec:
  type: NodePort
  selector:
    app: hello-web                # Ye label wale pods par traffic bhejo
  ports:
  - port: 80                      # Service ka port
    targetPort: 3000              # Container ka port
    nodePort: 30081               # Minikube node par khulne wala port
